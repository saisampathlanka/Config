# Use zsh as default shell
set -g default-shell /bin/zsh
set -g default-command /bin/zsh

# Enable focus events (required by some plugins)
set -g focus-events on

# 256 color support
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"

# Window indexing starts from 1
set -g base-index 1
setw -g pane-base-index 1

# Change prefix from Ctrl+B to Ctrl+Space
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# Allow time gap between prefix and command key
set -g escape-time 500

# Enable mouse support
set -g mouse on

# Status bar - no background color, custom text color
set -g status-style "bg=terminal,fg=colour250"
set -g status-left-style "fg=colour250"
set -g status-right-style "fg=colour250"
set -g window-status-current-style "fg=colour250"

# Vim-style pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Intuitive splits (open in current path)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# New window in current path
bind c new-window -c "#{pane_current_path}"

# Reload config on the fly
bind r source-file ~/.tmux.conf \; display "Config reloaded!"

# Resize panes
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Copy mode (vi-style)
setw -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "xclip -in -selection clipboard"
bind -T copy-mode-vi Escape send-keys -X cancel

# Mouse copy mode
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "xclip -in -selection clipboard"
bind -T copy-mode-vi MouseDown1Pane select-pane -e \; send-keys -X clear-selection
# bind -T copy-mode-vi Triple-Click1Pane select-pane -e \; send-keys -X select-line

# Enter copy mode
bind Enter copy-mode
